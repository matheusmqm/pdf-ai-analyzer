[project]
name = "pdfbeta"
version = "0.1.0"
description = "SecondMind: envie PDFs e faça perguntas sobre eles com o Claude (API da Anthropic), sobre Supabase (Postgres e Storage)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.128.8",
    "pdfplumber>=0.11.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.22",
    "supabase>=2.33.0",
    "uvicorn>=0.40.0",
]
