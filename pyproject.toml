[project]
name = "pdfbeta"
version = "0.1.0"
description = "API de análise de PDFs com LLM via OpenRouter, sobre Supabase (Auth, Postgres e Storage)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.8",
    "pdfplumber>=0.11.9",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "supabase>=2.33.0",
    "uvicorn>=0.40.0",
]
