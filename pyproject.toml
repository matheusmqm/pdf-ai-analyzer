[project]
name = "secondmind"
version = "0.1.0"
description = "SecondMind: upload PDFs and ask questions about them with Claude (Anthropic API), backed by Supabase (Postgres + Storage) and local Ollama embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0,<3",
    "fastapi>=0.128.8,<1",
    "httpx>=0.28.1,<1",
    "pdfplumber>=0.11.10,<1",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.16.2,<3",
    "python-multipart>=0.0.22,<1",
    "supabase>=2.33.0,<3",
    "uvicorn>=0.40.0,<1",
]
